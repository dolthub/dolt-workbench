name: Build dolt-workbench for Windows
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: GitHub Release Version Number
        required: true
        type: string
      submit-for-review:
        description: Submit the build for store review
        required: false
        default: false
        type: boolean
      whats-new:
        description: What's new in this version (required when submitting for review)
        required: false
        type: string

  workflow_call:
    inputs:
      release-version:
        description: Github Release Version Number
        required: true
        type: string
      via-call:
        description: Determines if this workflow was called by another workflow
        required: false
        default: true
        type: boolean
      submit-for-review:
        description: Submit the build for store review
        required: false
        default: false
        type: boolean
      whats-new:
        description: What's new in this version (required when submitting for review)
        required: false
        type: string

env:
  VIA_CALL: ${{ inputs.via-call || false }}

jobs:
  build-windows:
    name: Build Windows release version
    runs-on: windows-2022
    steps:
      - name: Validate branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "This workflow can only run from 'main' (got '${{ github.ref_name }}')." >&2
          exit 1

      - name: Validate submit inputs
        if: ${{ inputs.submit-for-review && inputs.whats-new == '' }}
        shell: bash
        run: |
          echo "'whats-new' is required when 'submit-for-review' is checked." >&2
          exit 1

      - name: Checkout code for full release
        if: ${{ inputs.via-call }}
        uses: actions/checkout@v3
        with:
          ref: release/${{ inputs.release-version }}
          submodules: true

      - name: Checkout code for individual build
        if: ${{ !inputs.via-call }}
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install yq
        run: |
          choco install yq -y

      - name: Bump Windows build version
        uses: ./.github/actions/bump-build-version
        with:
          platform: win
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            web/renderer/.next/cache
            web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/renderer/next.config.js', 'web/package.json', 'web/yarn.lock') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build Windows package
        working-directory: web
        run: |
          yarn build:win
          ls dist

      - name: Upload package to Release ${{ inputs.release-version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release-version }}
          files: |
            ${{ github.workspace }}/web/dist/squirrel-windows/Dolt-Workbench-win-x64.exe
            ${{ github.workspace }}/web/dist/squirrel-windows/*.nupkg
            ${{ github.workspace }}/web/dist/squirrel-windows/RELEASES

      - name: Upload app store artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.release-version }}
          path: ${{ github.workspace }}/web/dist/Dolt-Workbench-win-x64.appx
          retention-days: 90
          overwrite: true
          compression-level: 0

      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: ${{ inputs.submit-for-review }}

      - name: Upload and submit for Microsoft Store review
        if: ${{ inputs.submit-for-review }}
        shell: pwsh
        env:
          PRODUCT_ID: 9NQ8LQPH9VVH
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          WHATS_NEW: ${{ inputs.whats-new }}
          APPX: ${{ github.workspace }}/web/dist/Dolt-Workbench-win-x64.appx
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

          msstore publish $env:APPX --appId $env:PRODUCT_ID --noCommit

          $submission = msstore submission get $env:PRODUCT_ID | Out-String | ConvertFrom-Json
          foreach ($listing in $submission.listings.PSObject.Properties) {
            $listing.Value.baseListing.releaseNotes = $env:WHATS_NEW
          }
          $json = $submission | ConvertTo-Json -Depth 100 -Compress
          msstore submission update $env:PRODUCT_ID $json

          msstore submission publish $env:PRODUCT_ID

  commit-build-version:
    name: Commit new build version
    needs: build-windows
    runs-on: ubuntu-22.04
    concurrency:
      group: commit-build-version
      cancel-in-progress: false
    steps:
      - name: Get branch to checkout
        id: branch-to-update
        run: |
          if [[ ${{ env.VIA_CALL }} == 'true' ]]; then
            echo "branch=release/${{ inputs.release-version }}" >> $GITHUB_OUTPUT
          else
            echo "branch=build/win" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Checkout correct branch
        run: git switch -C ${{ steps.branch-to-update.outputs.branch }}

      - uses: ./.github/actions/bump-build-version
        with:
          platform: win
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: true
